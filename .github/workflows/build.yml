name: Build and release
on:
  push:
    branches: [master]
    tags: ['v*']
    paths: ['**', '!docs/**', '!**/*.md', 'docs/bundle.md']
  pull_request:
    branches: [master]
    paths: ['**', '!docs/**', '!**/*.md', 'docs/bundle.md']
  workflow_dispatch:
    inputs:
      extended_tests:
        description: Also build x86_64 for extra Linux SCSI regression coverage
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
env:
  OPENSTEP_CCACHE: '1'
  HOMEBREW_NO_INSTALL_UPGRADE: '1'
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
  HOMEBREW_CACHE: ${{ github.workspace }}/work/cache/homebrew
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      macos: ${{ steps.scope.outputs.macos }}
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci-scope.py
  linux:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore compiler and download caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/cache/ccache/
            work/cache/pip/
            work/cache/homebrew/downloads/
          key: build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.json', 'build/**', '.github/workflows/build.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.json', 'build/**', '.github/workflows/build.yml') }}-
            build-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git python3 python3-venv ninja-build pkg-config bison flex acpica-tools libglib2.0-dev libpixman-1-dev libsdl2-dev libslirp-dev libfdt-dev zlib1g-dev libzstd-dev libpng-dev libjpeg-dev gcc-hppa-linux-gnu gcc-sparc64-linux-gnu xsltproc fcode-utils python-is-python3
      - name: Build identity
        run: python3 scripts/version.py --github-env
      - name: Check inputs and source tooling
        run: |
          python3 scripts/sources.py check
          python3 tests/test-qmp.py
          python3 tests/test-sources.py
          python3 tests/test-ci-scope.py
          python3 tests/test-release.py
      - name: Build and test
        env:
          BUILD_JOBS: '4'
          OPENSTEP_EXTENDED_TESTS: ${{ inputs.extended_tests && '1' || '0' }}
        run: bash build/linux.sh
      - name: Smoke-test packaged bundle
        run: python3 tests/smoke-bundle.py out/linux-x86_64/openstep-qemu-*-linux-x86_64
      - name: Retain unstripped executables for debugging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-debug-binaries
          retention-days: 7
          compression-level: 9
          path: |
            out/linux-x86_64/qemu/qemu-system-*
            out/linux-x86_64/qemu/qemu-img
      - name: Matching source
        run: python3 scripts/source-archive.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shared-firmware
          path: out/linux-x86_64/firmware/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: linux-development
          path: |
            dist/
            out/linux-x86_64/tests/
            out/linux-x86_64/risc-tests/
            out/linux-x86_64/hppa-recovery-tests/
            out/linux-x86_64/sparc-pte-tests/
  macos:
    needs: [scope, linux]
    if: needs.scope.outputs.macos == 'true'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore compiler and download caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/cache/ccache/
            work/cache/pip/
            work/cache/homebrew/downloads/
          key: build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.json', 'build/**', '.github/workflows/build.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.json', 'build/**', '.github/workflows/build.yml') }}-
            build-v2-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: shared-firmware
          path: shared-firmware
      - name: Install build dependencies
        run: |
          if [[ "$(uname -m)" == x86_64 ]]; then
            # Use existing libraries without Homebrew's Intel upgrade chain.
            # QEMU's Meson fallback supplies libslirp.
            for formula in glib pixman ninja pkgconf; do
              brew list --versions "$formula"
            done
            python3 -c 'import sys; assert sys.version_info >= (3, 12)'
            echo 'OPENSTEP_CCACHE=0' >> "$GITHUB_ENV"
          else
            brew install ccache glib pixman libslirp ninja pkg-config python
          fi
      - name: Build identity
        run: python3 scripts/version.py --github-env
      - name: Build and test
        env:
          BUILD_JOBS: '4'
        run: OPENSTEP_FIRMWARE_DIR="$PWD/shared-firmware" bash build/macos.sh
      - name: Smoke-test packaged bundle
        run: python3 tests/smoke-bundle.py out/macos-*/openstep-qemu-*-macos-*
      - name: Matching source
        run: python3 scripts/source-archive.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: macos-${{ matrix.runner }}-development
          path: |
            dist/
            out/macos-*/tests/
            out/macos-*/risc-tests/
  windows:
    needs: [scope, linux]
    if: needs.scope.outputs.windows == 'true'
    timeout-minutes: 60
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore compiler and download caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/cache/ccache/
            work/cache/pip/
            work/cache/homebrew/downloads/
          key: build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.json', 'build/**', '.github/workflows/build.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.json', 'build/**', '.github/workflows/build.yml') }}-
            build-v2-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: shared-firmware
          path: shared-firmware
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          cache: true
          update: true
          install: >-
            base-devel git bison flex
            mingw-w64-ucrt-x86_64-ccache mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-glib2 mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-SDL2 mingw-w64-ucrt-x86_64-libslirp
      - name: Build identity
        run: python3 scripts/version.py --github-env
      - name: Build and test
        run: OPENSTEP_FIRMWARE_DIR="$PWD/shared-firmware" BUILD_JOBS=4 bash build/windows.sh
      - name: Smoke-test packaged bundle
        run: python3 tests/smoke-bundle.py out/windows-x86_64/openstep-qemu-*-windows-x86_64
      - name: Retain unstripped executables for debugging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-debug-binaries
          retention-days: 7
          compression-level: 9
          path: |
            out/windows-x86_64/qemu/qemu-system-*.exe
            out/windows-x86_64/qemu/qemu-img.exe
      - name: Matching source
        run: python3 scripts/source-archive.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-development
          path: |
            dist/
            out/windows-x86_64/tests/
            out/windows-x86_64/risc-tests/

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build identity
        run: python3 scripts/version.py --github-env
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*-development'
          path: artifacts
      - name: Validate complete release candidate
        run: python3 scripts/release.py prepare --directory artifacts --output candidate --commit "$GITHUB_SHA"
      - name: Publish master prerelease or version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            release_tag=master-build
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          python3 scripts/release.py publish --directory candidate --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --tag "$release_tag"
